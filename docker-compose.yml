services:
  postgres:
    image: postgres:16-alpine
    container_name: vehicle-search-postgres
    environment:
      POSTGRES_DB: vehicle_search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vehicle_search_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_search"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vehicle_search_data:

